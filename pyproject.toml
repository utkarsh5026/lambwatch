[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-watcher"
version = "0.1.0"
description = "Watch your Downloads folder for AWS Lambda deployment zips, archive them as versions, analyse them, and diff any two versions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lambda Watcher contributors" }]
keywords = ["aws", "lambda", "diff", "watchdog", "versioning", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "watchdog>=4.0",
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.15"]
lint = ["ruff>=0.15"]

[project.scripts]
lambda-watcher = "lambda_watcher.cli:main"
lw = "lambda_watcher.cli:main"

[project.urls]
Homepage = "https://github.com/utkarsh5026/Lambda-watcher-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP"]
# Optional[X] reads better next to typer's option declarations, and typer
# resolves the default-argument calls it asks for at import time.
ignore = ["UP045", "UP007", "B008"]

[tool.ruff.lint.per-file-ignores]
# CSS and HTML string literals do not benefit from being folded.
"src/lambda_watcher/diffing/render_html.py" = ["E501"]
"src/lambda_watcher/templates.py" = ["E501"]
